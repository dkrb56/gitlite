<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>GitLite</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span id="repo-title" class="muted">No repository selected</span>
        <span class="spacer"></span>
        <label class="branch-label">Branch <select id="branch-select" disabled></select></label>
        <button id="btn-new-branch" disabled>New branch</button>
        <span class="sep"></span>
        <button id="btn-fetch" disabled>Fetch</button>
        <button id="btn-pull" disabled>Pull</button>
        <button id="btn-push" disabled>Push</button>
        <span class="sep"></span>
        <button id="btn-refresh" disabled>Refresh</button>
        <span id="busy" class="busy" hidden></span>
      </header>

      <div id="columns">
        <aside id="col-repos" class="pane">
          <div class="pane-title">Repositories</div>
          <ul id="repo-list" class="list"></ul>
          <div class="pane-footer"><button id="btn-add-repo">+ Add repository</button></div>
        </aside>
        <div class="splitter v" data-side="left"></div>

        <section id="col-middle">
          <div id="pane-graph" class="pane">
            <div class="pane-title">History</div>
            <div id="graph-scroll" class="scroll" tabindex="0">
              <table id="graph-table"><tbody></tbody></table>
            </div>
          </div>
          <div class="splitter h"></div>
          <div id="pane-details" class="pane">
            <div class="pane-title" id="details-title">Commit</div>
            <div id="details" class="scroll"></div>
          </div>
        </section>

        <div class="splitter v" data-side="right"></div>
        <section id="col-file" class="pane">
          <div class="pane-title" id="file-title">File</div>
          <div id="diff-view" class="scroll"></div>
        </section>
      </div>

      <footer id="statusbar"><span id="status-text" class="muted">Ready</span></footer>
    </div>

    <div id="modal" hidden>
      <div class="modal-box">
        <div id="modal-title" class="modal-title"></div>
        <input id="modal-input" type="text" spellcheck="false" />
        <div class="modal-actions">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-ok" class="primary">OK</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
